<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tools</title>
<style>
  :root {
    --paper:#eef1f4; --panel:#fff; --ink:#17202b; --muted:#6d7987;
    --line:#d6dde4; --indigo:#3a2fd6; --teal:#0d6f6b;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; padding:28px 20px 60px; background:var(--paper); color:var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:780px; margin:0 auto; }

  .top { padding-bottom:20px; border-bottom:1px solid var(--line); }
  .eyebrow { font-family:var(--mono); font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--muted); margin:0 0 10px; }
  h1 { font-size:clamp(34px,7.5vw,54px); line-height:.92; font-weight:800;
    letter-spacing:-.045em; margin:0; text-transform:lowercase; }
  .tagline { margin:12px 0 0; color:var(--muted); font-size:14.5px; max-width:46ch; }

  .search { display:block; width:100%; margin:22px 0 0; padding:14px 16px;
    font-family:var(--mono); font-size:13px; letter-spacing:.02em;
    background:var(--panel); border:1.5px solid var(--line); color:var(--ink); }
  .search::placeholder { color:var(--muted); }
  .search:focus { outline:none; border-color:var(--indigo); }

  .grid { margin-top:22px; display:grid; gap:1px; background:var(--line);
    border:1px solid var(--line); }
  .card { display:block; background:var(--panel); padding:20px 20px;
    text-decoration:none; color:inherit; transition:background .12s; }
  .card:hover { background:#fbfbff; }
  .card .name { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .card b { font-size:17px; font-weight:650; letter-spacing:-.01em; }
  .card .go { font-family:var(--mono); font-size:11px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--indigo); flex:0 0 auto; }
  .card p { margin:8px 0 0; color:var(--muted); font-size:13.5px; max-width:52ch; }
  .card .tag { display:inline-block; margin-top:10px; font-family:var(--mono);
    font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--teal); }

  .empty { display:none; margin-top:22px; padding:20px; background:var(--panel);
    border:1px solid var(--line); font-family:var(--mono); font-size:12.5px; color:var(--muted); }
  .empty.on { display:block; }

  .foot { margin:34px 0 0; font-family:var(--mono); font-size:11px;
    letter-spacing:.06em; color:var(--muted); line-height:1.7; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="eyebrow">personal toolbox · runs in the browser</p>
    <h1>tools</h1>
    <p class="tagline">Small single-file utilities. Everything runs client-side — nothing you drop in ever leaves your browser.</p>
  </header>

  <input class="search" id="search" type="text" placeholder="Search tools… (try “image” or “word”)" autocomplete="off">

  <div class="grid" id="grid"></div>
  <p class="empty" id="empty">No tools match that search.</p>

  <p class="foot">
    Add a new tool by dropping its .html file next to this page and adding an entry to the list in index.html.
  </p>
</div>

<script>
  var TOOLS = [
    {
      name: "images → webp",
      href: "images-to-webp.html",
      desc: "Drag in PNG, JPG, GIF, BMP, AVIF or SVG files and get smaller WebP versions out, with adjustable quality. Transparency is preserved.",
      tags: ["image", "webp", "convert", "compress", "png", "jpg"]
    },
    {
      name: "docx → WordPress HTML",
      href: "docx-to-wp-html.html",
      desc: "Turns a Word document into clean HTML for WordPress — keeps headings, paragraphs and images, strips Word's styling, classes and inline CSS.",
      tags: ["docx", "word", "wordpress", "html", "convert", "manuscript"]
    }
  ];

  var grid = document.getElementById('grid');
  var empty = document.getElementById('empty');
  var search = document.getElementById('search');

  function render(filter) {
    var q = (filter || '').trim().toLowerCase();
    var shown = 0;
    grid.innerHTML = '';
    TOOLS.forEach(function (t) {
      var hay = (t.name + ' ' + t.desc + ' ' + t.tags.join(' ')).toLowerCase();
      if (q && hay.indexOf(q) === -1) return;
      shown++;
      var a = document.createElement('a');
      a.className = 'card';
      a.href = t.href;
      a.innerHTML =
        '<div class="name"><b>' + t.name + '</b><span class="go">open →</span></div>' +
        '<p>' + t.desc + '</p>' +
        '<span class="tag">' + t.tags[0] + '</span>';
      grid.appendChild(a);
    });
    empty.className = 'empty' + (shown ? '' : ' on');
  }

  search.addEventListener('input', function (e) { render(e.target.value); });
  render('');
</script>
</body>
</html>
